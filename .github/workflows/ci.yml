name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values only — CI never needs real secrets to build.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PROGRAM_ID: DrVK92avUZvKHbyxd3StwX9c3zkZf5nDNoBrgU32e1NE
      NEXT_PUBLIC_NETWORK: devnet
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NVIDIA_API_KEY: placeholder
      HELIUS_API_KEY: placeholder
      CRON_SECRET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
